auth:
  style: none
  detail: Public keyless HTTP JSON API. No API key, OAuth or CAPTCHA. security:[] in the spec.
  identity: >-
    Callers are tracked for quota purposes by email, a stable client fingerprint and a
    visitor cookie — not for authentication. Never rotate these to evade limits.
idempotency:
  coverage: none
  detail: >-
    No Idempotency-Key header or replay-protection token is documented. The single write
    (requestStartupMemo) relies on caller fingerprint/email de-duplication and the docs
    warning "never repeat POST while polling" — this is quota control, not idempotency.
    Agents must avoid blind retries of screening requests to prevent duplicate memos.
