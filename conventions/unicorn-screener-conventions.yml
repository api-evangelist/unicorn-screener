    requestStartupMemo is asynchronous — it returns 200 acceptance with an optional slug
    and memoUrl. Poll getScreeningStatus every 10 seconds with a bounded timeout; states
    running/refreshing continue, moved supplies publishedSlug, ready/failed/refresh-failed
    are terminal, unknown means stop. An email link is the fallback deliverable.
